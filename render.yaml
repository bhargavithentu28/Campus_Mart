services:
  - type: web
    name: campusmart-api
    env: node
    rootDir: .
    buildCommand: npm run build:render
    startCommand: npm run start --workspace=apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
